name: Shizuka
options:
  bundleIdPrefix: com.mlam31.shizuka
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Shizuka:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        # White 学 kanji on black, from ios/Assets.xcassets/AppIcon.appiconset
        # (regenerate with scripts/gen_icon.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Shizuka
        CFBundleIcons:
          CFBundleIconName: AppIcon
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    sources:
      - Assets.xcassets
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash mobile_app
        outputFileLists:
          $TARGET_BUILD_DIR/$EXECUTABLE_PATH
