name: Shizuka
options:
  bundleIdPrefix: com.mlam31.shizuka
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Shizuka:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Shizuka
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    sources: []
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash mobile_app
        outputFileLists:
          $TARGET_BUILD_DIR/$EXECUTABLE_PATH
