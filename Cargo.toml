[package]
name = "mobile_app"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.12"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
rand = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-ui-kit = { version = "0.2", features = ["UIPasteboard"] }

[build-dependencies]
slint-build = "1.12"

[profile.release]
strip = true
